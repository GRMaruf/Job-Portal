{% extends 'master/base.html' %}

{% block content %}
  <div class="card-body border mx-auto my-5" style="max-width: 500px;">
    <h2 class="text-center">Job Information</h2>
    <p class="text-muted text-center">Fill up the Job information</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="d-block text-center">
        <button type="submit" class="btn btn-outline-primary">Submit</button>
      </div>
    </form>
  </div>
{% endblock %}
